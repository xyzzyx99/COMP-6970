# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs


name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.20.8]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: project/package-lock.json  #  Points to the correct lock file

    - name: Install dependencies
      run: npm ci
      working-directory: project  #  Run inside 'project/'

    - name: Build
      run: npm run build --if-present
      working-directory: project  #  Optional build step

    - name: Run tests
      run: npm test
      working-directory: project  #  Runs tests from inside project

