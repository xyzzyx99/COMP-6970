<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Join a social network</title>
</head>

<body>
    <H1>Join a social network</H1>

    <form action="https://wp.zybooks.com/form-viewer.php" method="POST">
        <div>
            <p>
                <label for="fullName">
                    Full Name:
                </label>
                <input type="text" name="Full Name" id="fullName" required>
            </p>
        </div>

        <div>
            <p>
                <label for="email">
                    EMail Address:
                </label>
                <input type="text" name="Email Address" id="email" required>
            </p>
        </div>

        <div>
            <p>
                <label for="about">
                    About you:
                </label>
                <textarea id="about" name="About you" rows="3" cols="50"></textarea>
            </p>
        </div>

        <div>
            <label for="picture">
                Photo:
            </label>
            <input type="file" id="picture" name="Photo" accept="image/png, image/jpeg">
        </div>
        <div>
            <p>
                <input type="submit">
            </p>
        </div>
    </form>

</body>

</html>
