<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Happy Birthday Message Creator</title>
</head>

<body>
    <H1>Happy Birthday Message Creator</H1>

    <form id="form" action="https://wp.zybooks.com/form-viewer.php" method="POST">
        <div>
            <p>
                <label for="Message">
                    Message?
                </label>
                <input type="text" name="Message" id="Message" value="Happy Birthday!">
            </p>
        </div>

        <div>
            <p>
                <label for="email">
                    EMail Address?
                </label>
                <input type="text" name="email" id="email" onfocus="this.value=''" value="name@domain.com" pattern="[a-zA-Z0-9-_\.]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*">
            </p>
        </div>

        <div>
            <p>
                <label for="date">
                    Date to send?
                </label>
                <input type="date" name="date" id="date">
            </p>
        </div>

        <div>
            <p>
                <label for="color">
                    Message color?
                </label>
                <input type="color" name="color" id="color">
            </p>
        </div>

        <div>
            <p>
                <label for="blinks">
                    Number of blinks?
                </label>
                <input type="number" min="0" max="10" name="blinks" id="blinks" value="0">
            </p>
        </div>

        <div>
            <p>
                <label for="volume">
                    Music volume?
                </label>
                <input type="range" min="0" max="50" name="volume" id="volume" value="20">
            </p>
        </div>

        <div>
            <p>
                <button type="submit">Send Birthday Message</button>
            </p>
        </div>
    </form>


    <script>
        document.getElementById("form").addEventListener("submit", function (event) {
            event.preventDefault(); // Prevent the form from submitting

            // Get the values from the form
            let email = document.getElementById("email").value;

            // Regular Expressions for validation
            let emailRegex = /[a-zA-Z0-9-_\.]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*/;

            // Validate email
            if (!emailRegex.test(email)) {
                alert("Invalid email address!");
                return;
            }

            // If all validations pass
            alert("Form submitted successfully!");

            // Clear the form after successful submission
            document.getElementById("myForm").reset();
        });
    </script>

</body>

</html>
