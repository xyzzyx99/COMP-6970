<!DOCTYPE html>
<html>
<head>
    <title>Study Group Bulletin Board System</title>
    <style>
        .container {
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        /* Center align the buttons */
        .form-group:last-child {
            text-align: center;
        }
        .form-group:last-child .btn {
            margin: 0 5px;
        }
        /* Add hover effect for better user experience */
        .btn:hover {
            opacity: 0.9;
            transition: opacity 0.2s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Study Group Bulletin Board System</h2>
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">Login</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='registration.html'">New User Registration</button>
            </div>
        </form>
    </div>
</body>
</html>
