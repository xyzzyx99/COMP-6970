<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Group Bulletin Board System</title>
    <style>
        /* Keep previous styles */
        /* ... (styles omitted for brevity) ... */
    </style>
</head>
<body>

<button class="logout-button" onclick="logout()">Logout</button>

<h1>Study Group Bulletin Board System</h1>

<div id="subjectsList">
    Loading subjects...
</div>

<script>
    function logout() {
        alert('Logging out...');
        window.location.href = '/';
    }

    // Fetch and display subjects
    fetch('/subjects.xml')
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.text();
        })
        .then(xmlString => {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, "application/xml");
            const subjects = xmlDoc.getElementsByTagName('subject');

            let listHTML = '<ul>';
            for (let i = 0; i < subjects.length; i++) {
                const subjectName = subjects[i].textContent;
                listHTML += `<li><a href="subject.html?name=${encodeURIComponent(subjectName)}">${subjectName}</a></li>`;
            }
            listHTML += '</ul>';

            document.getElementById('subjectsList').innerHTML = listHTML;
        })
        .catch(error => {
            console.error('Error fetching subjects:', error);
            document.getElementById('subjectsList').innerText = 'Failed to load subjects.';
        });
</script>

</body>
</html>
