<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Content</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div id="frame" class="container py-5">
    <h1 class="mb-4">New Topic</h1>

    <!--    <form method="POST" action="/createPost" enctype="multipart/form-data" id="contentForm" class="card p-4 shadow-sm"> -->

    <form method="POST" enctype="multipart/form-data" id="contentForm" class="card p-4 shadow-sm">

        <div class="mb-3">
            <label for="titleInput" class="form-label">Title:</label>
            <input type="text" id="titleInput" name="title" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="textInput" class="form-label">Text:</label>
            <textarea id="textInput" name="textInput" class="form-control" rows="5"></textarea>
        </div>

        <div class="mb-3">
            <label for="imageInput" class="form-label">Upload Image:</label>
            <input type="file" id="imageInput" name="image" class="form-control" accept="image/*">
        </div>

        <!--            <button id = "submitButton" type="button" class="btn btn-success" onclick="submitContent()">Submit</button> -->
        <button id="submitButton" type="submit" class="btn btn-success">Submit Post</button>
    </form>
</div>

<!-- Bootstrap Bundle JS (Optional, only needed if you use Bootstrap JS components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="edit_post.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const subject = urlParams.get('subjectName');
        if (subject) {
            //document.querySelector('h1').textContent += ` – ${subject}`;
            document.querySelector('form').action = `/createPost?subjectName=${encodeURIComponent(subject)}`;
            document.querySelector('h1').textContent += ` – ${subject}`;
        }
    });
</script>

</body>
</html>
