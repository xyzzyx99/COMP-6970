<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Topic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" id="discussionsContainer">
    <h1 class="mb-4" id="topicHeader">Loading...</h1>
</div>

<script src="discussions.js"></script>

<script>

    const access = localStorage.getItem('accessibility') === 'true';

    if (access) {
        document.body.classList.add('large-font');
    }

    const params = new URLSearchParams(window.location.search);
    const subjectName = params.get('subjectName');
    const topicTitle = params.get('topicTitle');

    document.getElementById('topicHeader').textContent = topicTitle;

    async function loadThread() {
        try {
            const response = await fetch('/discussions.xml');
            const xmlText = await response.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

            const subjects = Array.from(xmlDoc.getElementsByTagName('subject'));
            const subject = subjects.find(s => s.getAttribute('name') === subjectName);
            if (!subject) throw new Error('Subject not found');

            const topics = Array.from(subject.getElementsByTagName('topic'));
            const topic = topics.find(t => t.getAttribute('title') === topicTitle);
            if (!topic) throw new Error('Topic not found');

            const thread = topic.getElementsByTagName('thread')[0];
            const discussions = thread ? Array.from(thread.getElementsByTagName('discussion')) : [];

            discussions.sort((a, b) => {
                const timeA = new Date(a.getElementsByTagName('timestamp')[0].textContent);
                const timeB = new Date(b.getElementsByTagName('timestamp')[0].textContent);
                return timeA - timeB;
            });

            let discussionsHtml = `
        <h3>${topicTitle}</h3>
        <table class="table">
          <tbody>`;

            discussions.forEach((d) => {
                const timestamp = new Date(d.getElementsByTagName('timestamp')[0]?.textContent || '').toLocaleString();
                const username = d.getElementsByTagName('username')[0]?.textContent || '';
                const content = d.getElementsByTagName('content')[0]?.textContent || '';
                const imageLocation = d.getElementsByTagName('imageLocation')[0]?.textContent || '';
                const description = d.getElementsByTagName('description')[0]?.textContent || 'Discussion image';
                discussionsHtml += `
  <tr>
    <td style="width: 200px">
      <strong>${username}</strong><br>
      <small class="text-muted">${timestamp}</small>
    </td>
    <td>
      <p>${content}</p>
      ${imageLocation ? `<img src="${imageLocation}" class="img-fluid" alt="${description}">` : ''}
    </td>
  </tr>`;
            });

            discussionsHtml += `</tbody></table>`;

            const container = document.getElementById('discussionsContainer');

            // Build buttons
            const backBtn = document.createElement('button');
            backBtn.className = 'btn btn-success';
            backBtn.textContent = 'Back to Topics';
            backBtn.onclick = () => {
                //window.location.href = `subjects.html?subjectName=${encodeURIComponent(subjectName)}`;
                window.location.href = 'topics_list.html?subjectName=' + encodeURIComponent(subjectName);
            };
            //backBtn.onclick = () => loadSubjectDiscussions(subjectName);

            const replyBtn = document.createElement('button');
            replyBtn.className = 'btn btn-success';
            replyBtn.textContent = 'Reply to Topic';


            replyBtn.onclick = () => {
                const returnTo = `view_topic.html?subjectName=${encodeURIComponent(subjectName)}&topicTitle=${encodeURIComponent(topicTitle)}`;
                window.location.href = `edit_post.html?subjectName=${encodeURIComponent(subjectName)}&topicTitle=${encodeURIComponent(topicTitle)}&returnTo=${encodeURIComponent(returnTo)}`;
            };

            const buttonRow = document.createElement('div');
            buttonRow.className = 'd-flex justify-content-between mb-3';

            const leftWrapper = document.createElement('div');
            const rightWrapper = document.createElement('div');
            leftWrapper.appendChild(backBtn);
            rightWrapper.appendChild(replyBtn);

            buttonRow.appendChild(leftWrapper);
            buttonRow.appendChild(rightWrapper);

            // Inject into page
            container.innerHTML = ''; // clear header
            container.appendChild(buttonRow);

            const contentDiv = document.createElement('div');
            contentDiv.innerHTML = discussionsHtml;
            container.appendChild(contentDiv);
        } catch
            (err) {
            console.error('Error loading thread:', err);
            document.getElementById('discussionsContainer').innerHTML = '<div class="alert alert-danger">Error loading discussion thread.</div>';
        }
    }


    loadThread();
</script>
</body>
</html>
