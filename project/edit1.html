<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Content</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="mb-4">Submit Content</h1>

    <form id="contentForm" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label for="textInput" class="form-label">Text:</label>
            <textarea id="textInput" name="textInput" class="form-control" rows="5"></textarea>
        </div>

        <div class="mb-3">
            <label for="imageInput" class="form-label">Upload Image:</label>
            <input type="file" id="imageInput" name="imageInput" class="form-control" accept="image/*">
        </div>

        <button type="button" class="btn btn-success" onclick="submitContent()">Submit</button>
    </form>
</div>

<!-- Bootstrap Bundle JS (Optional, only needed if you use Bootstrap JS components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="edit_post.js"></script>

</body>
</html>
