<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Content</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div id="frame" class="container py-5">
    <h1 class="mb-4">Submit Content</h1>

    <!-- <form method="POST" action="/createPost" enctype="multipart/form-data" id="contentForm" class="card p-4 shadow-sm"> -->
    <form method="POST" enctype="multipart/form-data" id="contentForm" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label for="textInput" class="form-label">Text:</label>
            <textarea id="textInput" name="textInput" class="form-control" rows="5"></textarea>
        </div>

        <div class="mb-3">
            <label for="imageInput" class="form-label">Upload Image:</label>
            <input type="file" id="imageInput" name="image" class="form-control" accept="image/*">
        </div>

        <div class="mb-3">
            <label for="descriptionInput" class="form-label">Image Description:</label>
            <input type="text" id="descriptionInput" name="description" class="form-control" placeholder="Describe the uploaded image">
        </div>

        <!--            <button id = "submitButton" type="button" class="btn btn-success" onclick="submitContent()">Submit</button> -->
        <!-- <<div class="d-flex justify-content-end gap-2">  -->
        <button id="submitButton" type="submit" class="btn btn-success">Submit Post</button>
        <!-- <button type="button" class="btn btn-success" onclick="goBack()">Cancel</button> -->
        <!-- <</div> -->
    </form>
</div>

<!-- Bootstrap Bundle JS (Optional, only needed if you use Bootstrap JS components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="edit_post.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const subjectName = params.get("subjectName");
        const topicTitle = params.get("topicTitle");
        const returnTo = params.get("returnTo");

        const form = document.getElementById("contentForm");

        if (subjectName && topicTitle) {
            let actionUrl = `/replyPost?subjectName=${encodeURIComponent(subjectName)}&topicTitle=${encodeURIComponent(topicTitle)}`;
            if (returnTo) actionUrl += `&returnTo=${encodeURIComponent(returnTo)}`;
            form.action = actionUrl;

            // Set page heading
            document.querySelector("h1").textContent = `Reply to: ${topicTitle}`;
        }

        // Add username from localStorage as a hidden field before submit
        form.addEventListener("submit", (e) => {
            const username = localStorage.getItem("username");
            if (username) {
                const hiddenInput = document.createElement("input");
                hiddenInput.type = "hidden";
                hiddenInput.name = "username";
                hiddenInput.value = username;
                form.appendChild(hiddenInput);
            }

            // Conditional validation: description required only if image is selected
            const image = document.getElementById("imageInput").files[0];
            const description = document.getElementById("descriptionInput").value.trim();
            if (image && description === "") {
                e.preventDefault();
                alert("Please provide a description for the uploaded image.");
            }
        });
    });
</script>

</body>
</html>
