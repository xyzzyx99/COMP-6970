<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Discussions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .subjects-list {
            display: block;
        }
        .subjects-list.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Course Discussions</h1>
        
        <!-- Course links -->
        <!--  <div class="list-group mb-4">
             <a href="#" class="list-group-item list-group-item-action" onclick="loadSubjectDiscussions('Programming Fundamentals')">
                 Programming Fundamentals
             </a>
             <a href="#" class="list-group-item list-group-item-action" onclick="loadSubjectDiscussions('Web Development')">
                 Web Development
             </a>
         </div> -->

         <div id="subjectList" class="list-group mb-4"></div>

         <!-- Topics container -->
        <div id="topicsContainer"></div>

        <!-- Discussions container -->
        <div id="discussionsContainer"></div>
    </div>

    <script src="discussions.js"></script>

    <script>
        async function loadSubjects() {
            try {
                const response = await fetch('/subjects');
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");

                const subjects = xmlDoc.getElementsByTagName("subject");
                const container = document.getElementById("subjectList");

                for (let i = 0; i < subjects.length; i++) {
                    const subjectName = subjects[i].textContent;
                    const link = document.createElement("a");
                    link.href = "#";
                    link.className = "list-group-item list-group-item-action";
                    link.textContent = subjectName;
                    link.onclick = () => loadSubjectDiscussions(subjectName);
                    container.appendChild(link);
                }
            } catch (err) {
                console.error("Failed to load subjects:", err);
            }
        }

        loadSubjects();
    </script>

</body>
</html>
